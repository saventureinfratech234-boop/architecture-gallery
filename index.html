    <title>Featured Gallery</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #ffffff;
            color: #333333;
        }


        /* =====================================================
           FEATURED PROJECTS
        ===================================================== */

        .featured-projects {
            width: 100%;
            margin-top: 70px;
            padding: 26px 0 18px;
            background: #062340;
            border-bottom: 2px solid #c88a19;
            overflow: hidden;
            position: relative;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .featured-title {
            text-align: center;
            color: #ffffff;
            font-size: 19px;
            font-weight: 600;
            margin: 0 0 12px;
        }


        /* =====================================================
           CATEGORY BUTTONS
        ===================================================== */

        .project-categories {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 0 auto 15px;
            padding: 0 15px;
        }

        .project-category {
            display: inline-block;
            min-width: 105px;
            padding: 7px 15px;
            text-align: center;
            color: #062340;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .project-category:hover {
            background: #c88a19;
            border-color: #c88a19;
            transform: translateY(-1px);
        }

        .project-category.active {
            background: #c88a19;
            border-color: #c88a19;
        }


        /* =====================================================
           SLIDER
        ===================================================== */

        .project-slider-wrapper {
            position: relative;
            width: 100%;
            max-width: 1450px;
            margin: 0 auto;
            padding: 0 45px;
        }

        .project-slider-viewport {
            width: 100%;
            overflow: hidden;
        }

        .project-slider {
            display: flex;
            gap: 6px;
            width: max-content;
            transition: transform 0.5s ease;
        }


        /* =====================================================
           PROJECT ITEM
        ===================================================== */

        .project-item {
            width: 165px;
            height: 105px;
            flex: 0 0 165px;
            position: relative;
            overflow: hidden;
            background: #0b3155;
            border-radius: 4px;
        }

        .project-item.hidden {
            display: none;
        }

        .project-item a {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            cursor: pointer;
        }

        .project-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .project-item:hover img {
            transform: scale(1.08);
        }


        /* =====================================================
           IMAGE HOVER TEXT
        ===================================================== */

        .project-item a::after {
            content: "View Full Image";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 7px 4px;
            text-align: center;
            color: #ffffff;
            font-size: 10px;
            background: rgba(4,28,53,0.88);
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .project-item:hover a::after {
            transform: translateY(0);
        }


        /* =====================================================
           CAROUSEL ARROWS
        ===================================================== */

        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #c88a19;
            color: #ffffff;
            font-size: 30px;
            font-weight: 300;
            line-height: 1;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            z-index: 50;
            transition: all 0.25s ease;
        }

        .carousel-arrow:hover {
            background: #e0a02b;
            transform: translateY(-50%) scale(1.08);
        }

        .carousel-arrow.left {
            left: 5px;
        }

        .carousel-arrow.right {
            right: 5px;
        }


        /* =====================================================
           FULLSCREEN POPUP
        ===================================================== */

        .image-popup {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.97);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px 80px;
            z-index: 99999;
        }

        .image-popup.show {
            display: flex;
        }

        .popup-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-content img {
            display: block;
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }


        /* =====================================================
           POPUP CLOSE
        ===================================================== */

        .popup-close {
            position: fixed;
            top: 20px;
            right: 28px;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #c88a19;
            color: #ffffff;
            border-radius: 50%;
            border: none;
            text-decoration: none;
            font-size: 34px;
            font-weight: 300;
            line-height: 1;
            z-index: 100002;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .popup-close:hover {
            background: #ffffff;
            color: #062340;
            transform: rotate(90deg);
        }


        /* =====================================================
           POPUP PREVIOUS / NEXT
        ===================================================== */

        .popup-prev,
        .popup-next {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(200,138,25,0.95);
            color: #ffffff;
            border: none;
            text-decoration: none;
            font-size: 42px;
            font-weight: 300;
            line-height: 1;
            border-radius: 4px;
            z-index: 100001;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .popup-prev {
            left: 20px;
        }

        .popup-next {
            right: 20px;
        }

        .popup-prev:hover,
        .popup-next:hover {
            background: #ffffff;
            color: #062340;
            transform: translateY(-50%) scale(1.08);
        }


        /* =====================================================
           POPUP COUNTER
        ===================================================== */

        .popup-counter {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(6,35,64,0.85);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 100003;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 1100px) {

            .project-item {
                width: 155px;
                flex: 0 0 155px;
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 650px) {

            .featured-projects {
                margin-top: 55px;
                padding: 20px 0 15px;
            }

            .featured-title {
                font-size: 17px;
                margin-bottom: 12px;
            }

            .project-categories {
                justify-content: flex-start;
                flex-wrap: nowrap;
                overflow-x: auto;
                padding: 0 10px 8px;
            }

            .project-categories::-webkit-scrollbar {
                display: none;
            }

            .project-category {
                flex: 0 0 auto;
            }

            .project-slider-wrapper {
                padding: 0 35px;
            }

            .project-item {
                width: 160px;
                flex: 0 0 160px;
                height: 115px;
            }

            .carousel-arrow {
                width: 32px;
                height: 38px;
                font-size: 25px;
            }

            .image-popup {
                padding: 30px 15px;
            }

            .popup-content img {
                max-width: 94vw;
                max-height: 82vh;
            }

            .popup-prev,
            .popup-next {
                width: 40px;
                height: 50px;
                font-size: 30px;
            }

            .popup-prev {
                left: 8px;
            }

            .popup-next {
                right: 8px;
            }

            .popup-close {
                top: 10px;
                right: 12px;
                width: 38px;
                height: 38px;
                font-size: 28px;
            }

            .popup-counter {
                bottom: 12px;
                font-size: 12px;
            }
        }

    </style>

</head>

<!-- =====================================================
     FULLSCREEN IMAGE POPUP
====================================================== -->

<div class="image-popup" id="imagePopup">

    <button class="popup-close"
            id="popupClose"
            aria-label="Close">
        &times;
    </button>


    <button class="popup-prev"
            id="popupPrev"
            aria-label="Previous">
        &lt;
    </button>


    <div class="popup-content">

        <img id="popupImage"
             src=""
             alt="">

    </div>


    <button class="popup-next"
            id="popupNext"
            aria-label="Next">
        &gt;
    </button>


    <div class="popup-counter"
         id="popupCounter">
        1 / 1
    </div>

</div>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const slider = document.getElementById("projectSlider");

    const sliderPrev = document.getElementById("sliderPrev");
    const sliderNext = document.getElementById("sliderNext");

    const categoryButtons =
        document.querySelectorAll(".project-category");

    const projectItems =
        document.querySelectorAll(".project-item");

    const imagePopup =
        document.getElementById("imagePopup");

    const popupImage =
        document.getElementById("popupImage");

    const popupClose =
        document.getElementById("popupClose");

    const popupPrev =
        document.getElementById("popupPrev");

    const popupNext =
        document.getElementById("popupNext");

    const popupCounter =
        document.getElementById("popupCounter");


    /* =====================================================
       VARIABLES
    ===================================================== */

    let currentCategory = "all";

    let visibleItems = [];

    let currentIndex = 0;

    let sliderPosition = 0;


    /* =====================================================
       UPDATE VISIBLE ITEMS
    ===================================================== */

    function updateVisibleItems() {

        visibleItems = [];

        projectItems.forEach(function (item) {

            const category =
                item.getAttribute("data-category");

            if (
                currentCategory === "all" ||
                category === currentCategory
            ) {

                item.classList.remove("hidden");

                visibleItems.push(item);

            } else {

                item.classList.add("hidden");

            }

        });


        sliderPosition = 0;

        slider.style.transform =
            "translateX(0)";

    }


    /* =====================================================
       CATEGORY FILTER
    ===================================================== */

    categoryButtons.forEach(function (button) {

        button.addEventListener("click", function () {

            currentCategory =
                button.getAttribute("data-category");


            categoryButtons.forEach(function (btn) {

                btn.classList.remove("active");

            });


            button.classList.add("active");


            updateVisibleItems();

        });

    });


    /* =====================================================
       INITIAL FILTER
    ===================================================== */

    updateVisibleItems();


    /* =====================================================
       CAROUSEL
    ===================================================== */

    function getSlideDistance() {

        const item =
            document.querySelector(
                ".project-item:not(.hidden)"
            );

        if (!item) {
            return 0;
        }

        const itemWidth =
            item.offsetWidth;

        return itemWidth + 6;

    }


    sliderNext.addEventListener("click", function () {

        const distance =
            getSlideDistance();

        if (!distance) {
            return;
        }


        const viewport =
            document.querySelector(
                ".project-slider-viewport"
            );

        const maxScroll =
            slider.scrollWidth -
            viewport.clientWidth;


        sliderPosition += distance;


        if (sliderPosition > maxScroll) {

            sliderPosition = 0;

        }


        slider.style.transform =
            "translateX(-" +
            sliderPosition +
            "px)";

    });


    sliderPrev.addEventListener("click", function () {

        const distance =
            getSlideDistance();

        if (!distance) {
            return;
        }


        const viewport =
            document.querySelector(
                ".project-slider-viewport"
            );

        const maxScroll =
            slider.scrollWidth -
            viewport.clientWidth;


        sliderPosition -= distance;


        if (sliderPosition < 0) {

            sliderPosition = maxScroll;

        }


        slider.style.transform =
            "translateX(-" +
            sliderPosition +
            "px)";

    });


    /* =====================================================
       OPEN POPUP
    ===================================================== */

    projectItems.forEach(function (item) {

        const link =
            item.querySelector("a");


        link.addEventListener("click", function (event) {

            event.preventDefault();


            /* ---------------------------------------------
               Build popup list based on current category
            --------------------------------------------- */

            const itemsForPopup =
                Array.from(projectItems).filter(function (project) {

                    const category =
                        project.getAttribute("data-category");

                    return (
                        currentCategory === "all" ||
                        category === currentCategory
                    );

                });


            visibleItems =
                itemsForPopup;


            currentIndex =
                visibleItems.indexOf(item);


            if (currentIndex < 0) {

                currentIndex = 0;

            }


            showPopup();

        });

    });


    /* =====================================================
       SHOW POPUP
    ===================================================== */

    function showPopup() {

        if (
            !visibleItems.length ||
            !visibleItems[currentIndex]
        ) {

            return;

        }


        const item =
            visibleItems[currentIndex];


        const image =
            item.getAttribute("data-image");


        const title =
            item.getAttribute("data-title");


        popupImage.src = image;

        popupImage.alt = title;


        popupCounter.textContent =
            (currentIndex + 1) +
            " / " +
            visibleItems.length;


        imagePopup.classList.add("show");


        document.body.style.overflow =
            "hidden";

    }


    /* =====================================================
       CLOSE POPUP
    ===================================================== */

    function closePopup() {

        imagePopup.classList.remove("show");

        document.body.style.overflow =
            "";

    }


    popupClose.addEventListener(
        "click",
        closePopup
    );


    /* =====================================================
       POPUP NEXT
    ===================================================== */

    popupNext.addEventListener("click", function () {

        if (!visibleItems.length) {
            return;
        }


        currentIndex++;


        if (
            currentIndex >=
            visibleItems.length
        ) {

            currentIndex = 0;

        }


        showPopup();

    });


    /* =====================================================
       POPUP PREVIOUS
    ===================================================== */

    popupPrev.addEventListener("click", function () {

        if (!visibleItems.length) {
            return;
        }


        currentIndex--;


        if (currentIndex < 0) {

            currentIndex =
                visibleItems.length - 1;

        }


        showPopup();

    });


    /* =====================================================
       CLICK OUTSIDE IMAGE TO CLOSE
    ===================================================== */

    imagePopup.addEventListener(
        "click",
        function (event) {

            if (
                event.target === imagePopup
            ) {

                closePopup();

            }

        }
    );


    /* =====================================================
       KEYBOARD CONTROLS
    ===================================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                !imagePopup.classList.contains("show")
            ) {

                return;

            }


            /* ESC */

            if (event.key === "Escape") {

                closePopup();

            }


            /* LEFT ARROW */

            if (event.key === "ArrowLeft") {

                popupPrev.click();

            }


            /* RIGHT ARROW */

            if (event.key === "ArrowRight") {

                popupNext.click();

            }

        }
    );


});

</script>


</body>
